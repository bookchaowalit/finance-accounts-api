# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      # The image runs 3.13, but the tests' embedded PostgreSQL (pgserver, dev extra) only ships
      # wheels up to cp312. Move to 3.13 once pgserver does.
      python-version: "3.12"
      # Ratchet: measured 58.52% on 2026-10-22 (threshold = measured - 2); raise it as tests grow.
      coverage-threshold: "56"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  # CD pilot (ADR-0003 / D3, platform-ci-workflows v1.2.0): after CI passes on main, deploy this exact
  # commit from Railway's GitHub source and smoke-test it. Off until the owner sets the repository
  # variable CD_DEPLOY=true, after the steps in docs/runbooks/cd-pilot.md.
  deploy:
    needs: [api, security]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CD_DEPLOY == 'true'
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/deploy-railway.yml@77c996e8047846c6355ef2acdf08177bf22fd8e6 # v1.2.0
    with:
      service-id: 99890e22-3638-457f-aed0-af23190b28f0
      environment-id: 6ea4583c-ec3b-4e87-a2c1-d571a38e15b9
      health-url: https://finance-accounts-api-production.up.railway.app/health
      health-expect: '"status":"ok"'
      commit-url: https://finance-accounts-api-production.up.railway.app/health
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
