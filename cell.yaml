# Finance accounts cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Bank, cash, wallet, credit and investment accounts. Other finance cells point at an account by its id (account_id).
# Amounts are real (float) like every kit cell; cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: finance-accounts
title: Finance accounts
resources:
  account:
    filters:
    - account_type
    - owner_scope
    - status
    unique:
    - - name
      - owner_scope
    ranges:
    - [opened_on, closed_on]
    fields:
      name:
        type: text
        required: true
        max_length: 200
      account_type:
        type: enum
        values:
        - bank
        - cash
        - wallet
        - payment
        - credit
        - investment
        - receivable
        - other
        required: true
      owner_scope:
        type: enum
        values:
        - personal
        - solo_empire
        - venture
        - client
        - shared
        default: personal
      institution:
        type: text
      currency:
        type: text
        default: THB
        max_length: 12
      status:
        type: enum
        values:
        - planned
        - active
        - paused
        - closed
        default: active
      opening_balance:
        type: real
      opened_on:
        type: date
      closed_on:
        type: date
      metadata:
        type: json
        json: object
      notes:
        type: text
